name: Generate README

on:
  # For testing
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  # Weekly schedule
  schedule:
    - cron: "0 6 * * 5" # Runs every Friday at 6:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # Install required dependencies for Puppeteer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: Run generate script
        run: npm run generate
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "false"
          PUPPETEER_ARGS: "--no-sandbox"

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Automatic README update
          branch: readme-update
          base: main
          title: "Automatic README update"
          body: |
            This PR updates the README with:
            - Latest blog posts
            - Updated repository stats
          delete-branch: true

      - name: Merge Pull Request
        if: >-
          github.event_name != 'pull_request' &&
          (steps.create-pull-request.outputs.pull-request-operation == 'created' ||
          steps.create-pull-request.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.create-pull-request.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: >-
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --match-head-commit "$PR_HEAD_SHA" --squash --delete-branch
